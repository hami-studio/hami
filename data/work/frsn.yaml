background: |
  The Future Right Skills Network (FRSN) is a public-private partnership launched in 2019 to help young people in India access quality work opportunities. Facilitated by Quest Alliance and supported by partners including Accenture, Cisco, JPMorganChase, SAP Labs India and LinkedIn, the network works with the Ministry of Skill Development and Entrepreneurship towards its goal of reaching one million young people by 2027.

  FRSN brings together stakeholders from across India through a series of state-level events. We developed a modular visual system that could adapt to each region while retaining a cohesive identity across the network. Gujarat was the first event, and became the starting point for building this system.

  Taking cues from India’s rich textile traditions, we developed a set of graphic motifs inspired by the visual language of each state. The motifs could be translated into patterns and applied across event collaterals, creating a visual identity that felt rooted in place while remaining part of a larger system.

  We paired these patterns with monochromatic cut-out imagery of Industrial Training Institute (ITI) trainers and educators. The greyscale imagery brought an industrial quality to the visual language, while the handmade quality of the cut-outs introduced a more human, tactile counterpoint.

  Alongside the event identity, we designed FRSN’s first whitepaper and its accompanying microsite. The visual language developed for the events—its underlying grid, motifs and cut-out imagery—was extended into the publication through a bespoke iconography and image system. The result was a connected visual ecosystem across print and digital, allowing the whitepaper to feel like a natural extension of the FRSN identity rather than a standalone communication.

alignment: |
  We were drawn to FRSN because of its ambition to make the transition from education to meaningful work more accessible to young people across India. It brought together a diverse network of organisations, institutions and communities around a shared goal—something we see as an opportunity for design to create clarity, connection and a sense of belonging.

  The project also gave us an opportunity to explore how a visual identity can hold together a national programme without flattening the cultural differences within it. By looking at local craft and visual traditions as a starting point, we could build a system that was both coherent and rooted in place.

  This balance between the local and the systemic is something we are particularly interested in at Hami: using design not simply to communicate an idea, but to help complex initiatives become more accessible, relatable and connected to the people they are trying to reach.

