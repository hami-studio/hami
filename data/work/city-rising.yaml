background: |
  At the heart of the project lies a simple, enduring idea from Deyan Sudjic: the city is not just built form, but memory—held in fragments of streets, objects, and everyday rituals. It is where collective memory settles, and where it is constantly rewritten.<sup>1</sup>

  Greenpeace India’s 'City Rising' builds on this premise. A people-led urban campaign, it invites citizens to reimagine their cities as healthier, more inclusive, and climate-responsive. Through the 'Imaginarium', people gather to envision their ideal city; through 'Placemaking', these ideas begin to take form in the real world. Greenpeace acts as a catalyst—amplifying citizen voices and translating shared imagination into public action.

  Running through the brief was a sense of nostalgia—a quiet longing for cities as they are remembered, and as they might still become. We chose to hold on to that feeling.

  This led us to the language of postal stamps: small, framed windows that capture moments of place and identity. From here, a shared visual system emerged—drawing from analogue artefacts across South Asia. Colours reference ageing documents; typefaces echo bureaucratic print; compositions borrow from popular urban culture tropes like comics and street posters—tapping into a shared, collective memory.

  The identity remains deliberately open. A flexible brandmark adapts across cities, languages, and scales, allowing each place to claim it as its own. Participant drawings from 'Imaginarium' sessions can be translated into stamps and postcards—imprinted, circulated, and folded back into the system itself. Alongside this, we developed a custom set of icons informed by cartographic libraries and urban signage—grouped into thematic lenses of intervention, yet free to be recombined.

  Overall, the identity resists a singular authorship. It is designed to be adopted, adapted, and reimagined—much like the cities it speaks to.


alignment: |
  Cities sit at the frontline of the climate crisis—and its solutions. They generate over 70% of global emissions and consume most of the world’s energy. In India, rapid urban growth is intensifying this reality, bringing with it rising risks—extreme heat, pollution, flooding, and water scarcity.

  These are the cities we inhabit. The ones we share with our families and communities. The crisis, therefore, feels immediate and personal.

  As a studio, we see design as a means for intervention. Climate justice is central to our practice and informs the work we choose to take on. 'City Rising' resonated with this belief—grounded in collective action and the idea that citizens can meaningfully shape the systems they live within.

