background: |
  Quest Alliance's 'Quest to Learn' was conceived as a space to collectively imagine the future of learning—bringing together educators, researchers, and young people to navigate a world shaped by climate uncertainty and rapid technological change. Anchored in themes of AI, futures literacy, and youth agency, the conference explored a critical shift: from anxiety about the future, to a more hopeful, adaptive way of engaging with it.

  Our engagement spanned two months, working closely with the Quest team to shape the narrative and bring coherence across every touchpoint of the conference. The identity was built around two key ideas—1. AI and 2. transformation. We used the star, both as a cultural symbol of aspiration and a visual shorthand for AI, extending it across patterns, icons, and spatial elements. In parallel, we explored the shift from "(Q)uantized to(2) (L)iquid" state of thinking, captured through a dynamic wordmark that combines structure and motion: a familiar "Q", a pixelated "2" signalling change, and a fluid, handwritten "L".

  The visual language spoke in a vibrant, youth-centric system, expanding Quest's core palette into electric purples, oranges, greens, and yellows. A central illustration, built from warped grid lines, mapped a speculative, technology-driven landscape, later translated into large-scale installations within the conference space. This language extended across AR/VR experiences, environmental graphics, interactive exhibits, and even tactile giveaways—creating a layered, immersive experience.

  From identity to installations, digital to physical, we worked end-to-end—crafting and overseeing every element to ensure a cohesive, participatory environment. The result was an ecosystem of interactions, designed to be explored, questioned, and experienced.


alignment: |
  Our association with Quest Alliance goes back to Ashis' early work as an interaction designer and researcher—studying how young people learn and shaping digital curricula around the technologies they engage with.

  Today, that landscape is shifting rapidly. With the rise of AI, gaps in access and opportunity are widening, especially for youth from marginalised communities, further compounded by challenges like climate change.

  We resonate deeply with Quest's mission: preparing young people at the margins for an uncertain, fast-evolving future. As a studio, we see this as critical work where design can help bridge access, understanding, and possibility.
