background: |
  Mapping Emotions began with a simple practice aimed at helping people better understand their emotional states. Every day, for a month, we logged our moods and the triggers behind them. Over time, what started as a structured exercise in self-tracking became something more open and intimate: an honest inquiry into our own mental space. When words weren't enough, visuals stepped in.

  The visual language that emerged was not meant to categorize or define. It grew naturally from the process. It translates complex feelings and lets emotional patterns surface without losing the nuance of the original experience.

  The final work lives as a series of visual maps and a free Figma template. Both are built on the same layered logic. When Stefan Sagmeister and Giorgia Lupi noticed the project, it helped more people start using it. Now, over 3,000 people worldwide use these tools to understand their emotions. That number still moves us, but more importantly, it points to something far simpler than data: a shared human need to reflect, to understand ourselves, and to feel a little less alone in the process.

alignment: |
  This project demonstrated that precise and empathetic information design can reveal hidden realities and transform personal experiences into collective understanding.

  It changed our view of data visualization, showing that it is not just analytical but also a means of reflection and meaning-making, expanding the role of design.

  This mindset now guides our approach to data storytelling, mental health communication, and our tools. We believe well-crafted design systems do more than organize—they can give form to the abstract, structure the emotional, and clarity to what is genuinely hard to say.

