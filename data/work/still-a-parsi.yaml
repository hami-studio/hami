background: |
  Still A Parsi started with a question about demographics. But soon, the focus shifted from numbers to the people behind them.

  The Parsi community is one of India's most historically rich, yet it is quietly shrinking. This project aimed to face that reality directly. Instead of observing from afar, we approached it with care. For six months, we spent time with five individuals in their homes, during their routines, and on ordinary days.

  We did not stage any scenes. We waited and only photographed what they chose to share. Over time, these portraits became part of something bigger. Personal objects, family archives, handwritten notes, and cultural artifacts all add layers to a story that numbers alone cannot tell.

  These stories and artifacts came together in a photo book. It gives readers room to notice nuance, ambiguity, and the complexity of a community’s living memory. The book does not offer a single narrative or a tidy conclusion. Instead, it invites you to slow down. Move through it as you would when visiting someone’s home for the first time: notice, reflect, and leave with more questions than you started with.

alignment: |
  Communities outside dominant narratives are often misunderstood or reduced to spectacle. This project asks a different question: instead of highlighting differences, it considers where we connect. Where do their rituals echo ours, their values reflect ours, and the particular become universal? These connections mark the start of real understanding.
