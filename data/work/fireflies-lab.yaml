background: |
  Greenpeace South Asia’s 'Fireflies Lab' is a creative learning space for young changemakers across South Asia. It brings together a generation of urban, digitally active individuals—people who care deeply about social and environmental issues, and are looking for ways to express that through creativity and action. At its core, the program connects storytelling, digital expression, and activism—equipping participants to shape narratives that move people. Each voice becomes a point of light; each story, part of something larger.

  Our approach was to translate this energy into a visual language that feels alive—rooted in youth, participation, and making. The identity carries a sense of warmth and imagination, reflecting the drive of a generation that wants to do better for the planet. It leans into the immediacy of DIY culture: hand-drawn, assembled, and intentionally imperfect.

  The brandmark is constructed using tape—drawing from protest placards, street posters, and graffiti—capturing urgency, voice, and presence. Subtle cues are borrowed from South Asian visual culture: the tittle of the ‘i’ references vernacular lettering, while the crimped badge form echoes familiar ornamental motifs. A palette of neons set against a deep forest ground draws from bioluminescence in nature—held here as a metaphor for youthful energy and collective glow.

  Across the system, paper-cut icons, masking-tape frames, and pixelated paper fragments move through compositions like scattered fireflies. Every element begins by hand, then transitions into the digital space—retaining texture, movement, and a sense of collective authorship.

  The identity remains open and evolving—designed to be shaped by those who use it—much like the stories it seeks to amplify.

alignment: |
  “We do not inherit the earth from our ancestors; we borrow it from our children.”

  This Native American proverb sits at the core of our interest in the project. We see design as a tool for amplifying voices—especially those that are young, unheard, and often excluded from systems of power.

  At a time when climate action and justice feel both urgent and uneven, storytelling becomes a way in. It invites people to engage, to question, and to participate. As a studio, we are drawn to work that creates space—for dialogue, experimentation, and new voices to emerge. This project offered exactly that: a platform where learning, making, and advocacy intersect.

