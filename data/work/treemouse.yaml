background: |
  Treemouse is a multidisciplinary studio focused on understanding human behaviour to drive meaningful change. Their work is grounded in a simple belief: what we interact with every day quietly shapes how we think and act. By paying attention to these often-overlooked patterns—the “invisibles” embedded in daily life—they uncover insights that lead to thoughtful, lasting impact.

  The identity draws directly from this idea of the “invisibles”—systems and objects that seamlessly integrate into our routines. We translated this into a wordmark that appears simple at first glance, but reveals subtle design gestures over time—small, intentional details embedded within its form. The aim was to reflect the studio’s approach: finding meaning in what is often overlooked, and designing for utility that feels natural, almost unnoticed. The palette builds on primary colours, with yellow capturing the spirit of the team—youthful, curious, and quietly energetic. The system balances play and precision, allowing for both expression and clarity across contexts.

  Clean grids and consistent structure give complex ideas room to breathe, ensuring the human story at the heart of their work always takes precedence.

  At the end of our stint, we designed an extensive brand bible—one that not only defined the identity but also made it accessible. Written with clarity and intent, it enabled a multidisciplinary team to engage with the system, understand its principles, and confidently carry it forward—inviting them into the world of design rather than keeping it behind closed doors.

alignment: |
  With Ashis as one of the founding members, and Pooja having worked closely with the team, this project felt inherently familiar—almost like coming home.

  What drew us further was the scale and depth of their work. Operating across critical sectors such as healthcare, finance, and government, Treemouse has shaped systems that impact people at a national level—often in ways that remain unseen, yet deeply felt.

  As a studio led by young practitioners, their ability to navigate complexity and drive meaningful change at such scale is both rare and inspiring. It reflects a shared belief—that thoughtful, research-driven design can influence not just products or services, but entire systems.

  This was not just a collaboration we aligned with, but one that deeply resonated with our own aspirations as a practice.
