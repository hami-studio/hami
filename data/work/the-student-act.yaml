background: |
  The Student Act is a learning design and innovation consultancy founded by Ragini Lall. Rooted in both real-world teaching experiences and the science of learning, the practice focuses on building thoughtful, effective learning experiences across curriculum, products, and programs. At the time, Ragini had already built an extensive body of work across geographies—from ed-tech to Harvard Graduate School of Education—but it existed in fragments, spread across roles, formats, and contexts. What she sought was a unified identity—one that could hold this breadth of work together, position her as a studio rather than an individual, and support her next phase of growth.

  Our role was to help shape that transition. Over an intensive period, we worked closely with her to distill her practice—mapping her values, vision, and positioning into a cohesive brand foundation. This clarity informed a visual identity that reflects both the rigour and play inherent in her work. Drawing from ideas of learning through making, the system uses simple geometric forms, data-inspired graphics, and a modular structure that is easy to extend and scale. Subtle cues—like a globe motif and a clean, structured wordmark—anchor the identity in her global experience and clarity of thought. The result is a brand that feels structured yet open, capable of holding complexity while remaining accessible—much like the learning experiences it represents.

alignment: |
  At the core of Ragini Lall’s practice is a simple belief: meaningful learning is intentional—regardless of medium. Digital, hybrid, or in-person, its quality lies in how thoughtfully it responds to context and to the learner.

  We align closely with this student-centric approach—where learning extends beyond institutions, and where agency, curiosity, and relevance shape engagement. In a rapidly evolving ed-tech landscape, this means creating experiences that are culturally grounded, creatively driven, and rooted in the real world.

  As a studio, we are drawn to work that places people at the centre. This project reflects that shared belief: that well-designed learning experiences are essential for a 21st-century learner.

